# Install as {{FRONTEND_SNIPPET}}.
# The browser remains on {{ISSUER_HOST}}; Next is an HTTPS upstream only.
proxy_pass {{FRONTEND_ORIGIN}};
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host {{FRONTEND_HOST}};
proxy_set_header X-Forwarded-Host {{ISSUER_HOST}};
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_ssl_server_name on;
proxy_ssl_name {{FRONTEND_TLS_NAME}};
proxy_ssl_verify on;
proxy_ssl_verify_depth 5;
proxy_ssl_trusted_certificate {{CA_BUNDLE}};
proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_redirect off;
