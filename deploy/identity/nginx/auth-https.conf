# Install as /etc/nginx/conf.d/ragent-auth.conf AFTER obtaining the certificate.
# This replaces auth-http.conf; never install both at once.
log_format identity_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name {{ISSUER_HOST}};
    access_log /var/log/nginx/ragent-auth.access.log identity_safe;
    location ^~ /.well-known/acme-challenge/ {
        root {{WEBROOT}};
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 {{ISSUER_ORIGIN}}$request_uri; }
}
server {
    listen 443 ssl;
    server_name {{ISSUER_HOST}};
    ssl_certificate {{CERTIFICATE_DIR}}/fullchain.pem;
    ssl_certificate_key {{CERTIFICATE_DIR}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ragent-auth.access.log identity_safe;
    error_log /var/log/nginx/ragent-auth.error.log crit;
    client_max_body_size 32k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    location = /identity-login { limit_except GET HEAD { deny all; } include {{FRONTEND_SNIPPET}}; }
    location ^~ /_next/ {
        limit_except GET HEAD { deny all; }
        include {{FRONTEND_SNIPPET}};
    }
    location = /api/system {
        limit_except GET HEAD { deny all; }
        include {{FRONTEND_SNIPPET}};
    }
    location ^~ /api/oss/system/ {
        limit_except GET HEAD { deny all; }
        include {{FRONTEND_SNIPPET}};
    }
    location = /favicon.ico { limit_except GET HEAD { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = /forgot-password { limit_except GET HEAD { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = /reset-password { limit_except GET HEAD { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = /api/v1/password/forgot { limit_except POST { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = /api/v1/password/reset { limit_except POST { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = /api/v1/password/verify-token { limit_except GET HEAD { deny all; } include {{FRONTEND_SNIPPET}}; }
    location = / { return 302 {{FRONTEND_ORIGIN}}/; }
    location = /api/auth/methods {
        limit_except GET HEAD { deny all; }
        include {{FRONTEND_SNIPPET}};
    }
    # No business API or application callback is exposed through this host.
    location ^~ /api/ { return 404; }
    location / {
        proxy_pass {{IDENTITY_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host {{ISSUER_HOST}};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host {{ISSUER_HOST}};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
