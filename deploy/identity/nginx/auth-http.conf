# Bootstrap only. Replace with auth-https.conf after certificate issuance.
# Install ONLY ONE auth config as /etc/nginx/conf.d/ragent-auth.conf.
log_format identity_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name {{ISSUER_HOST}};
    access_log /var/log/nginx/ragent-auth.access.log identity_safe;
    location ^~ /.well-known/acme-challenge/ {
        root {{WEBROOT}};
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
