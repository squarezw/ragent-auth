name: ragent-auth-local
services:
  identity:
    image: docker.io/squarezw/ragent-auth@sha256:7e7c69e9ddaa9b3ede580487aec6ef154fb2f830fb62177e8d2e222336d67aa7
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    # Read the owner-only host secret, then run the issuer as the image's node UID.
    user: "0:0"
    entrypoint: [node, --input-type=module, -e]
    command:
      - |
        import fs from 'node:fs';
        try {
          const values = JSON.parse(fs.readFileSync('/run/auth/runtime.json', 'utf8'));
          if (Object.values(values).some(v => typeof v !== 'string')) throw Error();
          Object.assign(process.env, values);
          process.setgid(1000); process.setuid(1000);
          await import('/app/src/main.js');
        } catch { console.error('Local auth configuration/startup failed'); process.exitCode = 1; }
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - ./secrets/local/docker-runtime.json:/run/auth/runtime.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8020/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
    ports:
      - "127.0.0.1:8021:8021"
    volumes:
      - ./deploy/local-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
